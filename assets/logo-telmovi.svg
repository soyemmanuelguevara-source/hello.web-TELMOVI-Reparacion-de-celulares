<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 205" role="img" aria-labelledby="title desc">
  <title id="title">TELMOVI</title>
  <desc id="desc">Logotipo de TELMOVI reparación de celulares mojados o caídos</desc>
  <defs>
    <filter id="softGlow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.10 0 0 0 0 0.45 0 0 0 0 1 0 0 0 .55 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g fill="none" fill-rule="evenodd">
    <path d="M596 36h59l-33 89h42l-76 62 30-88h-39z" fill="#14934D"/>
    <text x="18" y="100" font-family="Inter, Arial, sans-serif" font-size="82" font-weight="900" font-style="italic" letter-spacing="0" filter="url(#softGlow)">
      <tspan fill="#2E3A6D">TEL</tspan><tspan fill="#14934D">MOVI</tspan>
    </text>
    <path d="M20 125h548" stroke="#1D75E8" stroke-width="6" stroke-linecap="round"/>
    <text x="58" y="166" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="900" letter-spacing="0" fill="#FFFFFF" stroke="#1D75E8" stroke-width="3" paint-order="stroke">
      REPARACIÓN DE CELULARES
    </text>
    <text x="145" y="197" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="900" letter-spacing="0" fill="#FFFFFF" stroke="#1D75E8" stroke-width="3" paint-order="stroke">
      MOJADOS O CAÍDOS
    </text>
  </g>
</svg>
